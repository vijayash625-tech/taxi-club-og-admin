<!DOCTYPE html>

<style>

*{

body{

button,

button{

/* =====================================================
   LOGIN SCREEN
===================================================== */

#loginScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  min-height:100vh;
  display:flex;
  align-items:center;

    #eef6ff,

}

.loginCard{
  width:100%;
  max-width:400px;
  background:#ffffff;
  border:1px solid #dfe7f1;
  border-radius:22px;
  padding:28px 22px;
  box-shadow:
    0 15px 50px rgba(20,40,70,.12);

.loginLogo{
  text-align:center;
  font-size:25px;
  font-weight:900;
  color:#1769e0;
  margin-bottom:5px;
}

.loginSub{

  font-size:12px;

}

.loginTitle{
  font-size:20px;
  font-weight:900;
  margin-bottom:18px;
  color:#172033;
}

.loginField{
  margin-bottom:14px;
}

.loginField label{
  display:block;
  margin-bottom:6px;
  color:#58667a;
  font-size:12px;
  font-weight:800;
}

.loginField input{
  width:100%;
  padding:13px;
  border:1px solid #d5dce7;
  border-radius:11px;
  background:#fff;
  outline:none;
}

.loginField input:focus{
  border-color:#1769e0;
  box-shadow:

.loginButton{

  margin-top:5px;

}

.loginButton:active{

}

.loginError{
  display:none;

  padding:11px;

}

/* =====================================================
   ADMIN PANEL
===================================================== */

}

.brand{

.brand small{

}

nav{

  border-bottom:1px solid #e4e8ef;

nav button{

}

nav button.active{

main{

h1{

.sub{

.card{

}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.field label{
  display:block;
  margin-bottom:5px;
  color:#58667a;
  font-size:12px;
  font-weight:800;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:12px;
  border:1px solid #d5dce7;

  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{

}

.full{
  grid-column:1/-1;
}

.actions{

}

.btn{

  font-weight:800;

.primary{

}

.green{
  background:#0a9b62;
  color:#fff;
}

.red{

  color:#fff;
}

.orange{

}

.gray{

.blue{

.statgrid{

.stat{

.stat:hover{

.stat b{

.stat span{

.driver,

.name{

  font-weight:900;

.muted{

.route{

.route div{

.money{
  font-size:21px;

}

.wallet{
  font-size:25px;
  font-weight:900;
}

.negative{
  color:#d92d4a;
}

.badge{

  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.approved{
  background:#e7f8ef;
  color:#087443;
}

.blocked{
  background:#ffe8ed;
  color:#b4233d;
}

.pending{
  background:#fff3d6;
  color:#9a6500;
}

.rejected{
  background:#ffe8ed;
  color:#b4233d;
}

.open{
  background:#e9f3ff;
  color:#1769e0;
}

.accepted{
  background:#eaf8ef;
  color:#087443;
}

.cancelled{
  background:#fff0df;

}

.completed{

  color:#4438a8;
}

.deleted{
  background:#ffe8ed;
  color:#b4233d;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#eef6ff;
  color:#15559b;
  font-weight:700;
  margin:10px 0;
}

.empty{
  text-align:center;
  padding:25px;
  color:#738097;
}

.loading{
  text-align:center;
  padding:30px;
  color:#66758a;
}


/* =====================================================
   CUSTOM MODAL
===================================================== */

.modalBack{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.48);
}

.modalBack.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modalTitle{
  font-size:19px;
  font-weight:900;
  margin-bottom:9px;
}

.modalText{
  color:#5f6d81;
  line-height:1.55;
  white-space:pre-line;
}

.modalActions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.modalActions button{
  flex:1;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(100px);
  z-index:10000;
  background:#172033;
  color:#fff;
  padding:13px 17px;
  border-radius:12px;
  font-weight:700;
  font-size:13px;
  opacity:0;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast.error{
  background:#b4233d;
}


@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .statgrid{
    grid-template-columns:repeat(2,1fr);
  }

  h1{

  }

  .brand{

  }

  .top{
    padding:12px;
  }

  .btn{
    min-width:100px;
  }

  .headerRight{
    gap:5px;
  }

  .status{
    display:none;
  }

}

</style>

</div>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  doc,
  updateDoc,
  onSnapshot,
  serverTimestamp,
  runTransaction
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCXOKF-5BEE_qqZWuO08A_Dks4F0b-3q8",

  authDomain:
  "taxi-club-og-driver.firebaseapp.com",

  projectId:
  "taxi-club-og-driver",

  storageBucket:
  "taxi-club-og-driver.firebasestorage.app",

  messagingSenderId:
  "319131350971",

  appId:
  "1:319131350971:web:922a1bb441b4f63823769e",

  measurementId:
  "G-FY2SEGK4WG"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   ADMIN LOGIN
===================================================== */

const ADMIN_USER_ID =
  "7708988625";

const ADMIN_PASSWORD =
  "VIJAY8978";

let listenersStarted =
  false;


window.adminLogin =
function(){

  const userId =
    $("adminUserId")
      .value
      .trim();


  const password =
    $("adminPassword")
      .value;


  if(
    userId === ADMIN_USER_ID &&
    password === ADMIN_PASSWORD
  ){

    $("loginError")
      .classList
      .remove("show");


    $("adminPassword")
      .value = "";


    $("loginScreen")
      .style.display =
      "none";


    $("panelScreen")
      .style.display =
      "block";


    if(!listenersStarted){

      listenersStarted = true;

      startListeners();

    }


    render();

  }
  else{

    $("loginError")
      .classList
      .add("show");

  }

};


window.adminLogout =
function(){

  $("panelScreen")
    .style.display =
    "none";


  $("loginScreen")
    .style.display =
    "flex";


  $("adminUserId")
    .value = "";


  $("adminPassword")
    .value = "";


  $("loginError")
    .classList
    .remove("show");

};


/* =====================================================
   STATE
===================================================== */

let page = "duty";

let drivers = [];

let duties = [];

let history = [];

let trips = [];

let driverFilter = "ALL";


/* =====================================================
   HELPERS
===================================================== */

const $ =
  id => document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


function statusOf(d){

  return String(
    d.status || "OPEN"
  ).toUpperCase();

}


function driverStatus(d){

  const s =
    String(
      d.status || "PENDING"
    ).toUpperCase();


  if(
    d.approved === true ||
    s === "APPROVED" ||
    s === "ACTIVE"
  ){

    return "APPROVED";

  }


  return s;

}


function normalizeDate(value){

  let s =
    String(value || "")
      .replace(/\D/g,"")
      .slice(0,8);


  if(s.length === 8){

    return (
      s.slice(0,2) +
      "/" +
      s.slice(2,4) +
      "/" +
      s.slice(4,8)
    );

  }


  return value || "";

}


window.formatDate =
function(input){

  let raw =
    input.value
      .replace(/\D/g,"")
      .slice(0,8);


  if(raw.length <= 2){

    input.value = raw;

  }
  else if(raw.length <= 4){

    input.value =
      raw.slice(0,2) +
      "/" +
      raw.slice(2);

  }
  else{

    input.value =
      raw.slice(0,2) +
      "/" +
      raw.slice(2,4) +
      "/" +
      raw.slice(4);

  }

};


/* =====================================================
   TIME FORMAT
===================================================== */

window.formatTime =
function(input){

  let raw =
    input.value
      .replace(/\D/g,"")
      .slice(0,4);


  if(raw.length <= 2){

    input.value = raw;

  }
  else{

    input.value =
      raw.slice(0,2) +
      ":" +
      raw.slice(2,4);

  }

};


/* =====================================================
   TOAST
===================================================== */

function toast(
  message,
  error=false
){

  const t =
    $("toast");


  t.textContent =
    message;


  t.classList.toggle(
    "error",
    error
  );


  t.classList.add("show");


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      () =>
        t.classList.remove("show"),
      3000
    );

}


/* =====================================================
   CUSTOM CONFIRM
===================================================== */

function confirmBox(
  title,
  text,
  okText="CONFIRM",
  danger=true
){

  return new Promise(resolve => {

    const back =
      $("modalBack");


    $("modalTitle")
      .textContent =
      title;


    $("modalText")
      .textContent =
      text;


    $("modalOK")
      .textContent =
      okText;


    $("modalOK")
      .style
      .background =
      danger
      ? "#d92d4a"
      : "#1769e0";


    $("modalCancel").onclick =
      () => {

        back
          .classList
          .remove("show");

        resolve(false);

      };


    $("modalOK").onclick =
      () => {

        back
          .classList
          .remove("show");

        resolve(true);

      };


    back
      .classList
      .add("show");

  });

}


/* =====================================================
   DASHBOARD BOX FILTERS
===================================================== */

window.showDriverFilter =
function(filter){

  driverFilter =
    String(
      filter || "ALL"
    ).toUpperCase();


  page = "duty";


  [
    "duty",
    "open",
    "accepted",
    "history"
  ]
  .forEach(x => {

    $("nav-"+x)
      .classList
      .toggle(
        "active",
        x === "duty"
      );

  });


  render();

};


window.showOpenDuties =
function(){

  driverFilter =
    "ALL";


  showPage("open");

};


/* =====================================================
   NAVIGATION
===================================================== */

window.showPage =
function(p){

  page = p;


  if(p === "duty"){

    driverFilter =
      "ALL";

  }


  [
    "duty",
    "open",
    "accepted",
    "history"
  ]
  .forEach(x => {

    $("nav-"+x)
      .classList
      .toggle(
        "active",
        x === p
      );

  });


  render();

};


/* =====================================================
   CONNECTION
===================================================== */

function setConnected(ok){

  $("connection")
    .textContent =
    ok
    ? "FIREBASE CONNECTED"
    : "FIREBASE ERROR";


  $("connection")
    .style
    .background =
    ok
    ? "#e9f8ef"
    : "#ffe8ed";


  $("connection")
    .style
    .color =
    ok
    ? "#087443"
    : "#b4233d";

}


/* =====================================================
   DRIVER FINDER
===================================================== */

function driverForDuty(d){

  const values = [

    d.acceptedByUid,

    d.acceptedDriverId,

    d.driverId,

    d.driverMobile

  ];


  for(
    const value of values
  ){

    if(!value)
      continue;


    const found =
      drivers.find(x =>

        String(
          x.uid || ""
        ) === String(value)

        ||

        String(
          x.driverId ||
          x.id ||
          ""
        ) === String(value)

        ||

        String(
          x.mobile ||
          x.phone ||
          ""
        ) === String(value)

      );


    if(found)
      return found;

  }


  return null;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  if(page === "duty")
    renderDuty();

  else if(page === "open")
    renderOpen();

  else if(page === "accepted")
    renderAccepted();

  else if(page === "history")
    renderHistory();

}


/* =====================================================
   DUTY PAGE
===================================================== */

function renderDuty(){

  const approved =
    drivers.filter(
      d =>
        driverStatus(d)
        === "APPROVED"
    ).length;


  const pending =
    drivers.filter(
      d =>
        driverStatus(d)
        === "PENDING"
    ).length;


  const blocked =
    drivers.filter(
      d =>
        driverStatus(d)
        === "BLOCKED"
    ).length;


  const open =
    duties.filter(
      d =>
        statusOf(d)
        === "OPEN"
    ).length;


  let filteredDrivers =
    drivers;


  if(
    driverFilter === "APPROVED"
    ||
    driverFilter === "PENDING"
    ||
    driverFilter === "BLOCKED"
  ){

    filteredDrivers =
      drivers.filter(
        d =>
          driverStatus(d)
          === driverFilter
      );

  }


  let filterTitle =
    "ALL DRIVERS";


  if(driverFilter !== "ALL"){

    filterTitle =
      driverFilter +
      " DRIVERS";

  }


  $("app").innerHTML = `

    <h1>
      🚕 Duty Management
    </h1>

    <div class="sub">
      Duty creation + ₹400 registration approval
    </div>


    <div class="statgrid">

/* =====================================================
   HISTORY
   duty_history + trips
===================================================== */

function renderHistory(){

  const combined = [

    ...history,

    ...trips.map(t => ({

      ...t,

      type:
        t.type ||
        (
          String(t.status || "")
            .toUpperCase() === "COMPLETED"
          ?
          "TRIP_COMPLETED"
          :
          t.status || ""
        ),

      status:
        t.status ||
        "COMPLETED"

    }))

  ];


  const unique = [];

  const seen = new Set();


  combined.forEach(item => {

    const type =
      String(
        item.type ||
        item.status ||
        ""
      ).toUpperCase();


    const dutyId =
      item.dutyId ||
      item.id ||
      "";


    const key =
      dutyId
      ?
      `${dutyId}_${type.includes("COMPLETE") ? "COMPLETED" : type}`
      :
      (
        item.id
        ?
        `id_${item.id}`
        :
        `raw_${JSON.stringify(item)}`
      );


    if(!seen.has(key)){

      seen.add(key);

      unique.push(item);

    }

  });


  const rows =
    [...unique]
      .sort(
        (a,b) =>
          stampMillis(
            b.createdAt ||
            b.completedAt
          ) -
          stampMillis(
            a.createdAt ||
            a.completedAt
          )
      );


  $("app").innerHTML = `

    <h1>
      📋 History
    </h1>


    <div class="sub">
      All driver and duty activity
    </div>


    <div class="card">

      <h2>
        ALL ACTIVITY (${rows.length})
      </h2>


      ${
        rows.length
        ?
        rows
          .map(historyCard)
          .join("")
        :
        `
        <div class="empty">
          No history yet.
        </div>
        `
      }

    </div>

  `;

}

/* =====================================================
   CREATE DUTY
===================================================== */

async function createDuty(){

  try{

    const pickup =
      $("pickup")
        .value
        .trim();


    const drop =
      $("drop")
        .value
        .trim();


    const date =
      normalizeDate(
        $("date")
          .value
          .trim()
      );


    const time =
      $("time")
        .value
        .trim();


    const vehicle =
      $("vehicle")
        .value;


    const km =
      Number(
        $("km")
          .value
      );


    const amount =
      Number(
        $("amount")
          .value
      );


    const note =
      $("note")
        .value
        .trim();


    const timeValid =
      /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(
        time
      );


    if(
      !pickup ||
      !drop ||
      !date ||
      !timeValid ||
      km <= 0 ||
      amount < 0
    ){

      toast(
        "Pickup, Drop, Date, correct Time (HH:MM), KM and Amount enter pannunga.",
        true
      );

      return;

    }


    await addDoc(
      collection(
        db,
        "duties"
      ),
      {

        pickup,

        drop,

        date,

        time,

        vehicle,

        km,

        amount,

        note,

        status:"OPEN",

        acceptedBy:"",

        acceptedDriverId:"",

        acceptedByUid:"",

        driverId:"",

        driverName:"",

        driverMobile:"",

        rejectedBy:"",

        rejectedByUid:"",

        rejectedDriverId:"",

        cancelledBy:"",

        cancelledByUid:"",

        cancelledDriverId:"",

        cancellationDeduction:0,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );


    toast(
      "Duty created successfully."
    );


    showPage("open");


  }catch(e){

    console.error(e);


    toast(
      "Duty create failed: " +
      e.message,
      true
    );

  }

}

/* =====================================================
   DRIVER ACCESS
===================================================== */

function accessKey(d){

  const mobile =
    String(
      d.mobile ||
      d.phone ||
      d.driverMobile ||
      ""
    )
    .replace(
      /\D/g,
      ""
    );


  const driverId =
    d.driverId ||
    d.id ||
    "";


  return (
    mobile ||
    String(driverId)
      .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
      )
  );

}


async function updateDriverAccess(
  d,
  status
){

  const key =
    accessKey(d);


  if(!key)
    return;


  const ref =
    doc(

/* =====================================================
   DELETE DRIVER
===================================================== */

async function deleteDriver(id){

  const d =
    drivers.find(
      x => x.id === id
    );


  if(!d)
    return;


  const name =
    d.name ||
    d.driverName ||
    "Driver";


  const ok =
    await confirmBox(
      "DELETE DRIVER ACCOUNT",
      "Driver:\n" +
      name +
      "\n\n" +
      "இந்த Driver record Firestore-லிருந்து உண்மையாக DELETE ஆகும்.\n\n" +
      "Driver App access status DELETED ஆக save செய்யப்படும்.",
      "DELETE DRIVER",
      true
    );


  if(!ok)
    return;


  try{

    await runTransaction(
      db,
      async tx => {

        const driverRef =
          doc(
            db,
            "drivers",
            id
          );


        const snap =
          await tx.get(
            driverRef
          );


        if(!snap.exists()){

          throw new Error(
            "Driver record already deleted."
          );

        }


        const data =
          snap.data();


        const key =
          accessKey({
            ...data,
            id
          });


        if(!key){

          throw new Error(
            "Driver mobile/ID missing."
          );

        }


        const accessRef =
          doc(
            db,
            "driver_access",
            key
          );


        const historyRef =
          doc(
            collection(
              db,
              "duty_history"
            )
          );


        tx.set(
          accessRef,
          {

            mobile:
              data.mobile ||
              data.phone ||
              data.driverMobile ||
              "",

            driverId:
              data.driverId ||
              id,

            uid:
              data.uid ||
              "",

            driverName:
              data.name ||
              data.driverName ||
              name,

            status:"DELETED",

            blocked:true,

            deleted:true,

            approved:false,

            deletedAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          },
          {
            merge:true
          }
        );


        tx.set(
          historyRef,
          {

            type:"DRIVER_DELETED",

            status:"DELETED",

            driverId:
              data.driverId ||
              id,

            driverName:
              data.name ||
              data.driverName ||
              name,

            driverMobile:
              data.mobile ||
              data.phone ||
              data.driverMobile ||
              "",

            createdAt:
              serverTimestamp()

          }
        );


        tx.delete(
          driverRef
        );

      }
    );


    drivers =
      drivers.filter(
        x => x.id !== id
      );


    render();


    toast(
      "Driver account permanently deleted."
    );


  }catch(e){

    console.error(e);


    toast(
      "DELETE DRIVER failed: " +
      e.message,
      true
    );

  }

}


/* =====================================================
   WALLET ADD
===================================================== */

async function addWallet(id){

  const input =
    $("wallet-"+id);


  const amount =
    Number(
      input?.value
    );


  if(
    !amount ||
    amount <= 0
  ){

    toast(
      "Valid amount enter pannunga.",
      true
    );

    return;

  }


  try{

    await runTransaction(
      db,
      async tx => {

        const ref =
          doc(
            db,
            "drivers",
            id
          );


        const snap =
          await tx.get(ref);


        if(!snap.exists()){

          throw new Error(
            "Driver not found"
          );

        }


        const data =
          snap.data();


        const old =
          Number(
            data.walletBalance ??
            data.wallet ??
            0
          );


        const next =
          old + amount;


        tx.update(
          ref,
          {

            walletBalance:
              next,

            wallet:
              next,

            lastWalletAction:
              "ADD",

            lastWalletAmount:
              amount,

            walletUpdatedAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          }
        );

      }
    );


    input.value = "";


    toast(
      "Wallet added."
    );


  }catch(e){

    console.error(e);


    toast(
      "Wallet ADD failed: " +
      e.message,
      true
    );

  }

}

/* =====================================================
   TIMESTAMP
===================================================== */

function stampMillis(v){

  if(!v)
    return 0;


  if(
    typeof v.toMillis ===
    "function"
  ){

    return v.toMillis();

  }


  if(v.seconds){

    return Number(
      v.seconds
    ) * 1000;

  }


  const n =
    Date.parse(v);


  return isNaN(n)
    ? 0
    : n;

}


function formatStamp(v){

  const n =
    stampMillis(v);


  return n
    ?
    new Date(n)
      .toLocaleString("en-IN")
    :
    "";

}
