<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAXI CLUB OG - Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:800}.brand small{display:block;font-size:11px;color:#64748b;margin-top:3px}
.status{font-size:12px;padding:7px 10px;border-radius:20px;background:#e9f8ef;color:#087443;font-weight:700}
nav{position:sticky;top:71px;z-index:19;background:#fff;border-bottom:1px solid #e5e9f0;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:13px 4px;background:#fff;color:#526074;font-weight:700;font-size:12px}
nav button.active{color:#1769e0;border-bottom:3px solid #1769e0;background:#f5f9ff}
main{max-width:900px;margin:auto;padding:16px 14px 70px}
h1{margin:6px 0 4px;font-size:28px}.sub{color:#68758a;margin-bottom:18px}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #1b31500d}
.card h2{font-size:18px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.field label{display:block;font-size:12px;font-weight:700;color:#56647a;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d7dee9;border-radius:11px;background:#fff;outline:none}
.field textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}
.btn{padding:11px 14px;border-radius:11px;font-weight:800}
.primary{background:#1769e0;color:#fff}.green{background:#0b9b62;color:#fff}.red{background:#d92d4a;color:#fff}.orange{background:#e88a00;color:#fff}.gray{background:#edf1f6;color:#25344b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1;min-width:110px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:14px;border-radius:15px;background:#f7f9fc;border:1px solid #e5e9f0}
.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#68758a}
.driver,.duty{border:1px solid #e1e7ef;border-radius:16px;padding:14px;margin:10px 0;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:19px;font-weight:800}.muted{color:#66758b;font-size:13px;line-height:1.55}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}
.approved{background:#e7f8ef;color:#087443}.blocked{background:#ffe8ed;color:#b4233d}.pending{background:#fff3d6;color:#9a6500}.rejected{background:#ffe8ed;color:#b4233d}
.open{background:#e9f3ff;color:#1769e0}.accepted{background:#eaf8ef;color:#087443}.cancelled{background:#fff0df;color:#a45b00}.completed{background:#e9eafc;color:#4438a8}
.route{font-size:16px;font-weight:700;margin:10px 0}.route div{padding:4px 0}
.money{font-size:21px;font-weight:900}.wallet{font-size:24px;font-weight:900}.negative{color:#d92d4a}
.empty{text-align:center;padding:25px;color:#738097}
.notice{padding:12px;border-radius:12px;background:#eef6ff;color:#15559b;font-weight:700;margin:10px 0}
.loading{text-align:center;padding:25px;color:#64748b}
.hidden{display:none!important}
@media(max-width:650px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.top{padding:12px}.brand{font-size:18px}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">🚕 TAXI CLUB OG<small>ADMIN PANEL</small></div>
  <div id="connection" class="status">CONNECTING...</div>
</header>

<nav>
  <button id="nav-duty" class="active" onclick="showPage('duty')">🚕 DUTY</button>
  <button id="nav-open" onclick="showPage('open')">🟢 OPEN</button>
  <button id="nav-accepted" onclick="showPage('accepted')">✅ ACCEPTED</button>
  <button id="nav-history" onclick="showPage('history')">📋 HISTORY</button>
</nav>

<main id="app"><div class="loading">Loading...</div></main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  serverTimestamp,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCXOKF-5BEE_qqZWuO08A_Dks4F0b-3q8",
  authDomain:"taxi-club-og-driver.firebaseapp.com",
  projectId:"taxi-club-og-driver",
  storageBucket:"taxi-club-og-driver.firebasestorage.app",
  messagingSenderId:"319131350971",
  appId:"1:319131350971:web:922a1bb441b4f63823769e",
  measurementId:"G-FY2SEGK4WG"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let page="duty";
let drivers=[];
let duties=[];
let history=[];
let unDrivers=null;
let unDuties=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

window.showPage=function(p){
  page=p;
  ["duty","open","accepted","history"].forEach(x=>{
    $("nav-"+x).classList.toggle("active",x===p);
  });
  render();
};

function setConnected(ok){
  $("connection").textContent=ok?"FIREBASE CONNECTED":"FIREBASE ERROR";
  $("connection").style.background=ok?"#e9f8ef":"#ffe8ed";
  $("connection").style.color=ok?"#087443":"#b4233d";
}

function normalizeDate(v){
  let s=String(v||"").replace(/\D/g,"").slice(0,8);
  if(s.length===8)return s.slice(0,2)+"/"+s.slice(2,4)+"/"+s.slice(4,8);
  return v||"";
}

window.formatDate=function(input){
  input.value=normalizeDate(input.value);
};

function statusOf(d){return String(d.status||"OPEN").toUpperCase();}

function driverForDuty(d){
  const keys=[
    ["acceptedByUid",d.acceptedByUid],
    ["acceptedDriverId",d.acceptedDriverId],
    ["driverId",d.driverId],
    ["mobile",d.driverMobile]
  ];
  for(const [,value] of keys){
    if(!value)continue;
    const found=drivers.find(x=>
      String(x.uid||"")===String(value) ||
      String(x.driverId||x.id||"")===String(value) ||
      String(x.mobile||x.phone||"")===String(value)
    );
    if(found)return found;
  }
  return null;
}

function driverStatus(d){
  const s=String(d.status||"PENDING").toUpperCase();
  if(d.approved===true||s==="APPROVED"||s==="ACTIVE")return "APPROVED";
  return s;
}

function render(){
  if(page==="duty")renderDuty();
  if(page==="open")renderOpen();
  if(page==="accepted")renderAccepted();
  if(page==="history")renderHistory();
}

function renderDuty(){
  const approved=drivers.filter(d=>driverStatus(d)==="APPROVED").length;
  const pending=drivers.filter(d=>driverStatus(d)==="PENDING").length;
  const open=duties.filter(d=>statusOf(d)==="OPEN").length;
  const accepted=duties.filter(d=>statusOf(d)==="ACCEPTED"||statusOf(d)==="STARTED").length;

  $("app").innerHTML=`
    <h1>🚕 Duty Management</h1>
    <div class="sub">Create duty + driver approval/payment control</div>

    <div class="statgrid">
      <div class="stat"><b>${approved}</b><span>APPROVED DRIVERS</span></div>
      <div class="stat"><b>${pending}</b><span>PENDING DRIVERS</span></div>
      <div class="stat"><b>${open}</b><span>OPEN DUTIES</span></div>
      <div class="stat"><b>${accepted}</b><span>ACCEPTED</span></div>
    </div>

    <div class="card">
      <h2>➕ CREATE DUTY</h2>
      <div class="grid">
        <div class="field"><label>PICKUP</label><input id="pickup" placeholder="Pickup location"></div>
        <div class="field"><label>DROP</label><input id="drop" placeholder="Drop location"></div>
        <div class="field"><label>DATE</label><input id="date" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY" oninput="formatDate(this)"></div>
        <div class="field"><label>TIME</label><input id="time" type="time"></div>
        <div class="field"><label>VEHICLE</label>
          <select id="vehicle"><option>SEDAN</option><option>SUV</option><option>MINI</option></select>
        </div>
        <div class="field"><label>KM</label><input id="km" type="number" min="0" placeholder="KM"></div>
        <div class="field"><label>AMOUNT ₹</label><input id="amount" type="number" min="0" placeholder="Amount"></div>
        <div class="field"><label>NOTE</label><input id="note" placeholder="Toll / parking / extra note"></div>
      </div>
      <div class="actions">
        <button class="btn primary" onclick="createDuty()">CREATE DUTY</button>
      </div>
    </div>

    <div class="card">
      <h2>👨‍✈️ DRIVER APPROVAL</h2>
      <div class="notice">Driver registers → ₹400 payment → Admin approves. Only APPROVED drivers can use the Driver App.</div>
      ${drivers.length?drivers.map(driverCard).join(""):`<div class="empty">No drivers found.</div>`}
    </div>
  `;
}

function driverCard(d){
  const s=driverStatus(d);
  const wallet=Number(d.walletBalance??d.wallet??0);
  return `
  <div class="driver">
    <div class="row">
      <div>
        <div class="name">👨‍✈️ ${esc(d.name||d.driverName||"Driver")}</div>
        <div class="muted">📱 ${esc(d.mobile||d.phone||"")}<br>
        🪪 ${esc(d.licenseNumber||"-")}<br>
        🚕 ${esc(d.vehicleNumber||"-")} - ${esc(d.vehicleModel||d.vehicle||"-")}</div>
      </div>
      <span class="badge ${s==="APPROVED"?"approved":s==="BLOCKED"?"blocked":s==="REJECTED"?"rejected":"pending"}">${esc(s)}</span>
    </div>

    <div class="muted" style="margin-top:8px">
      Payment: <b>${esc(String(d.paymentStatus||"PENDING").toUpperCase())}</b>
      &nbsp; | &nbsp; Registration: <b>₹${Number(d.registrationFee||400)}</b>
    </div>

    <div class="actions">
      ${s!=="APPROVED"?`<button class="btn green" onclick="approveDriver('${esc(d.id)}')">✓ APPROVE</button>`:""}
      ${s!=="REJECTED"?`<button class="btn orange" onclick="rejectDriver('${esc(d.id)}')">✕ REJECT</button>`:""}
      ${s!=="BLOCKED"?`<button class="btn red" onclick="blockDriver('${esc(d.id)}')">⛔ BLOCK</button>`:
      `<button class="btn green" onclick="unblockDriver('${esc(d.id)}')">UNBLOCK</button>`}
      <button class="btn gray" onclick="deleteDriver('${esc(d.id)}')">🗑 DELETE</button>
    </div>

    <div class="card" style="margin:10px 0 0;padding:12px;background:#f8fbff">
      <div class="wallet">💰 ₹<span class="${wallet<0?"negative":""}">${wallet}</span></div>
      <div class="muted">Driver wallet — admin only</div>
      <div class="grid" style="margin-top:8px">
        <div class="field"><label>AMOUNT</label><input id="wallet-${esc(d.id)}" type="number" placeholder="Amount"></div>
      </div>
      <div class="actions">
        <button class="btn green" onclick="addWallet('${esc(d.id)}')">＋ ADD</button>
        <button class="btn red" onclick="deductWallet('${esc(d.id)}')">− DEDUCT</button>
      </div>
    </div>
  </div>`;
}

function renderOpen(){
  const list=duties.filter(d=>statusOf(d)==="OPEN");
  $("app").innerHTML=`
    <h1>🟢 Open Duties</h1>
    <div class="sub">Only duties waiting for a driver</div>
    <div class="notice">Accepted / Cancelled / Completed / Deleted duties will NOT appear here.</div>
    <div class="card">
      <h2>🚕 OPEN DUTIES (${list.length})</h2>
      ${list.length?list.map(openDutyCard).join(""):`<div class="empty">No open duties.</div>`}
    </div>`;
}

function openDutyCard(d){
  return `<div class="duty">
    <div class="row"><b>DUTY</b><span class="badge open">OPEN</span></div>
    <div class="route"><div>📍 ${esc(d.pickup)}</div><div>🏁 ${esc(d.drop)}</div></div>
    <div class="muted">📅 ${esc(d.date||"-")} &nbsp; ⏰ ${esc(d.time||"-")}<br>
    🚕 ${esc(d.vehicle||"-")} &nbsp; 📏 ${Number(d.km||0)} KM</div>
    <div class="money">₹${Number(d.amount||0)}</div>
    ${d.note?`<div class="notice">📝 ${esc(d.note)}</div>`:""}
    <div class="actions">
      <button class="btn orange" onclick="cancelDuty('${esc(d.id)}')">✕ CANCEL</button>
      <button class="btn red" onclick="deleteDuty('${esc(d.id)}')">🗑 DELETE</button>
    </div>
  </div>`;
}

function renderAccepted(){
  const list=duties.filter(d=>["ACCEPTED","STARTED"].includes(statusOf(d)));
  $("app").innerHTML=`
    <h1>✅ Accepted Duties</h1>
    <div class="sub">Driver who accepted each duty</div>
    <div class="card">
      <h2>ACCEPTED DUTIES (${list.length})</h2>
      ${list.length?list.map(acceptedCard).join(""):`<div class="empty">No accepted duties.</div>`}
    </div>`;
}

function acceptedCard(d){
  const dr=driverForDuty(d);
  const name=d.driverName||d.acceptedBy||dr?.name||dr?.driverName||"Unknown Driver";
  const mobile=d.driverMobile||dr?.mobile||dr?.phone||"-";
  const vid=dr?.vehicleNumber||d.vehicleNumber||"-";
  const vm=dr?.vehicleModel||"-";
  return `<div class="duty">
    <div class="row"><b>${esc(name)}</b><span class="badge accepted">${esc(statusOf(d))}</span></div>
    <div class="route"><div>📍 ${esc(d.pickup)}</div><div>🏁 ${esc(d.drop)}</div></div>
    <div class="muted">📅 ${esc(d.date||"-")} &nbsp; ⏰ ${esc(d.time||"-")}<br>
    📱 ${esc(mobile)}<br>
    🚘 Vehicle: ${esc(vid)} - ${esc(vm)}<br>
    🆔 Driver ID: ${esc(d.acceptedDriverId||d.driverId||dr?.driverId||"-")}<br>
    🔐 UID: ${esc(d.acceptedByUid||dr?.uid||"-")}</div>
    <div class="money">₹${Number(d.amount||0)} · ${Number(d.km||0)} KM</div>
    ${d.acceptedAt?`<div class="muted">Accepted: ${formatStamp(d.acceptedAt)}</div>`:""}
    <div class="actions">
      <button class="btn orange" onclick="cancelAcceptedDuty('${esc(d.id)}')">✕ CANCEL</button>
      <button class="btn green" onclick="completeDuty('${esc(d.id)}')">✓ COMPLETE</button>
    </div>
  </div>`;
}

function renderHistory(){
  const rows=[...history].sort((a,b)=>stampMillis(b.createdAt)-stampMillis(a.createdAt));
  $("app").innerHTML=`
    <h1>📋 Trip History</h1>
    <div class="sub">Completed / Cancelled / Rejected / Deleted — all drivers</div>
    <div class="card">
      <h2>ALL ACTIVITY (${rows.length})</h2>
      ${rows.length?rows.map(historyCard).join(""):`<div class="empty">No history yet.</div>`}
    </div>`;
}

function historyCard(h){
  const type=String(h.type||h.status||"").toUpperCase();
  const cls=type.includes("COMPLETE")?"completed":type.includes("CANCEL")?"cancelled":type.includes("REJECT")?"rejected":"pending";
  return `<div class="duty">
    <div class="row">
      <b>${esc(h.driverName||h.acceptedBy||"Driver")}</b>
      <span class="badge ${cls}">${esc(type)}</span>
    </div>
    <div class="route"><div>📍 ${esc(h.pickup||"-")}</div><div>🏁 ${esc(h.drop||"-")}</div></div>
    <div class="muted">📱 ${esc(h.driverMobile||h.mobile||"-")}<br>
    📅 ${esc(h.date||"-")} &nbsp; ⏰ ${esc(h.time||"-")}<br>
    📏 ${Number(h.km||0)} KM</div>
    <div class="money">₹${Number(h.amount||0)}</div>
    ${h.cancellationDeduction?`<div class="notice">Wallet deduction: ₹${Number(h.cancellationDeduction)}</div>`:""}
    <div class="muted">${formatStamp(h.createdAt)}</div>
  </div>`;
}

async function createDuty(){
  try{
    const pickup=$("pickup").value.trim();
    const drop=$("drop").value.trim();
    const date=normalizeDate($("date").value.trim());
    const time=$("time").value;
    const vehicle=$("vehicle").value;
    const km=Number($("km").value);
    const amount=Number($("amount").value);
    const note=$("note").value.trim();

    if(!pickup||!drop||!date||!time||!km||amount<0){
      alert("Pickup, Drop, Date, Time, KM and Amount enter pannunga.");
      return;
    }
    await addDoc(collection(db,"duties"),{
      pickup,drop,date,time,vehicle,km,amount,note,
      status:"OPEN",
      acceptedBy:"",
      acceptedDriverId:"",
      acceptedByUid:"",
      driverId:"",
      driverName:"",
      driverMobile:"",
      rejectedBy:"",
      rejectedByUid:"",
      rejectedDriverId:"",
      cancelledBy:"",
      cancelledByUid:"",
      cancelledDriverId:"",
      cancellationDeduction:0,
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    alert("Duty created successfully.");
    showPage("open");
  }catch(e){
    console.error(e);
    alert("Duty create failed: "+e.message);
  }
}

async function approveDriver(id){
  try{
    await updateDoc(doc(db,"drivers",id),{
      status:"APPROVED",
      approved:true,
      paymentStatus:"APPROVED",
      paymentVerified:true,
      registrationFee:400,
      updatedAt:serverTimestamp()
    });
    alert("Driver APPROVED.");
  }catch(e){console.error(e);alert("Approve failed: "+e.message);}
}

async function rejectDriver(id){
  if(!confirm("Reject this driver?"))return;
  try{
    await updateDoc(doc(db,"drivers",id),{
      status:"REJECTED",
      approved:false,
      updatedAt:serverTimestamp()
    });
    alert("Driver REJECTED.");
  }catch(e){console.error(e);alert("Reject failed: "+e.message);}
}

async function blockDriver(id){
  if(!confirm("Block this driver?"))return;
  try{
    await updateDoc(doc(db,"drivers",id),{
      status:"BLOCKED",
      approved:false,
      blocked:true,
      updatedAt:serverTimestamp()
    });
    alert("Driver BLOCKED. Driver App will not allow this driver.");
  }catch(e){console.error(e);alert("BLOCK failed: "+e.message);}
}

async function unblockDriver(id){
  try{
    await updateDoc(doc(db,"drivers",id),{
      status:"APPROVED",
      approved:true,
      blocked:false,
      updatedAt:serverTimestamp()
    });
    alert("Driver UNBLOCKED.");
  }catch(e){console.error(e);alert("Unblock failed: "+e.message);}
}

async function deleteDriver(id){
  const d=drivers.find(x=>x.id===id);
  if(!d)return;
  const name=d.name||d.driverName||"Driver";
  if(!confirm("DELETE DRIVER ACCOUNT?\n"+name+"\n\nFirestore driver record will be permanently deleted."))return;
  try{
    await deleteDoc(doc(db,"drivers",id));
    drivers=drivers.filter(x=>x.id!==id);
    render();
    alert("Driver account record deleted.");
  }catch(e){
    console.error(e);
    alert("DELETE DRIVER FAILED:\n"+e.message);
  }
}

async function addWallet(id){
  const input=$("wallet-"+id);
  const amount=Number(input?.value);
  if(!amount||amount<=0){alert("Valid amount enter pannunga.");return;}
  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,"drivers",id);
      const snap=await tx.get(ref);
      if(!snap.exists())throw new Error("Driver not found");
      const old=Number(snap.data().walletBalance??snap.data().wallet??0);
      tx.update(ref,{
        walletBalance:old+amount,
        wallet:old+amount,
        lastWalletAction:"ADD",
        lastWalletAmount:amount,
        walletUpdatedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    });
    input.value="";
    alert("Wallet added.");
  }catch(e){console.error(e);alert("Wallet ADD failed: "+e.message);}
}

async function deductWallet(id){
  const input=$("wallet-"+id);
  const amount=Number(input?.value);
  if(!amount||amount<=0){alert("Valid amount enter pannunga.");return;}
  if(!confirm("Deduct ₹"+amount+" from wallet? Negative balance is allowed."))return;
  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,"drivers",id);
      const snap=await tx.get(ref);
      if(!snap.exists())throw new Error("Driver not found");
      const old=Number(snap.data().walletBalance??snap.data().wallet??0);
      const next=old-amount;
      tx.update(ref,{
        walletBalance:next,
        wallet:next,
        lastWalletAction:"DEDUCT",
        lastWalletAmount:amount,
        walletUpdatedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    });
    input.value="";
    alert("Wallet deducted.");
  }catch(e){console.error(e);alert("Wallet DEDUCT failed: "+e.message);}
}

async function deleteDuty(id){
  const d=duties.find(x=>x.id===id);
  if(!d)return;
  if(!confirm("DELETE this duty permanently?"))return;

  try{
    // Save history first. Then delete the actual active duty document.
    await addDoc(collection(db,"duty_history"),{
      ...historySafe(d),
      type:"DUTY_DELETED",
      status:"DELETED",
      deletedAt:serverTimestamp(),
      createdAt:serverTimestamp()
    });
    await deleteDoc(doc(db,"duties",id));
    duties=duties.filter(x=>x.id!==id);
    render();
    alert("Duty deleted successfully. It is removed from Open Duties.");
  }catch(e){
    console.error(e);
    alert("DUTY DELETE FAILED:\n"+e.message);
  }
}

async function cancelDuty(id){
  const d=duties.find(x=>x.id===id);
  if(!d)return;
  if(!confirm("Cancel this duty? It will be removed from Open Duties."))return;

  try{
    await addDoc(collection(db,"duty_history"),{
      ...historySafe(d),
      type:"DUTY_CANCELLED",
      status:"CANCELLED",
      cancelledBy:"ADMIN",
      createdAt:serverTimestamp()
    });
    await deleteDoc(doc(db,"duties",id));
    duties=duties.filter(x=>x.id!==id);
    render();
    alert("Duty cancelled and removed.");
  }catch(e){
    console.error(e);
    alert("CANCEL FAILED:\n"+e.message);
  }
}

async function cancelAcceptedDuty(id){
  const d=duties.find(x=>x.id===id);
  if(!d)return;
  const dr=driverForDuty(d);
  const driverId=dr?.id||d.acceptedDriverId||d.driverId;
  const deduction=150;

  if(!confirm("Cancel accepted duty?\n₹150 will be deducted from the driver's wallet."))return;

  try{
    if(driverId){
      await runTransaction(db,async tx=>{
        const driverRef=doc(db,"drivers",driverId);
        const dutyRef=doc(db,"duties",id);
        const ds=await tx.get(driverRef);
        const ws=await tx.get(dutyRef);
        if(!ws.exists())throw new Error("Duty no longer exists");
        const old=ds.exists()?Number(ds.data().walletBalance??ds.data().wallet??0):0;
        const next=old-deduction;
        if(ds.exists()){
          tx.update(driverRef,{
            walletBalance:next,
            wallet:next,
            lastWalletAction:"DUTY_CANCEL_DEDUCTION",
            lastWalletAmount:deduction,
            walletUpdatedAt:serverTimestamp(),
            updatedAt:serverTimestamp()
          });
        }
        tx.delete(dutyRef);
      });
    }else{
      await deleteDoc(doc(db,"duties",id));
    }

    await addDoc(collection(db,"duty_history"),{
      ...historySafe(d),
      type:"DUTY_CANCELLED",
      status:"CANCELLED",
      cancelledBy:"ADMIN",
      cancellationDeduction:deduction,
      createdAt:serverTimestamp()
    });

    duties=duties.filter(x=>x.id!==id);
    render();
    alert("Accepted duty cancelled. ₹150 deducted.");
  }catch(e){
    console.error(e);
    alert("ACCEPTED DUTY CANCEL FAILED:\n"+e.message);
  }
}

async function completeDuty(id){
  const d=duties.find(x=>x.id===id);
  if(!d)return;
  if(!confirm("Mark this duty as COMPLETED?"))return;

  try{
    await runTransaction(db,async tx=>{
      const dutyRef=doc(db,"duties",id);
      const snap=await tx.get(dutyRef);
      if(!snap.exists())throw new Error("Duty no longer exists");

      const data=snap.data();
      const base=historySafe({...data,id});

      const tripRef=doc(collection(db,"trips"));
      const histRef=doc(collection(db,"duty_history"));

      tx.set(tripRef,{
        ...base,
        status:"COMPLETED",
        type:"TRIP_COMPLETED",
        completedAt:serverTimestamp(),
        createdAt:serverTimestamp()
      });

      tx.set(histRef,{
        ...base,
        status:"COMPLETED",
        type:"DUTY_COMPLETED",
        createdAt:serverTimestamp()
      });

      tx.delete(dutyRef);
    });

    duties=duties.filter(x=>x.id!==id);
    render();
    alert("Duty completed and removed from active duties.");
  }catch(e){
    console.error(e);
    alert("COMPLETE FAILED:\n"+e.message);
  }
}

function historySafe(d){
  return {
    dutyId:d.id||"",
    pickup:d.pickup||"",
    drop:d.drop||"",
    date:d.date||"",
    time:d.time||"",
    vehicle:d.vehicle||"",
    km:Number(d.km||0),
    amount:Number(d.amount||0),
    note:d.note||"",
    driverId:d.driverId||d.acceptedDriverId||"",
    acceptedDriverId:d.acceptedDriverId||"",
    acceptedByUid:d.acceptedByUid||"",
    driverName:d.driverName||d.acceptedBy||"",
    driverMobile:d.driverMobile||"",
    acceptedBy:d.acceptedBy||"",
    rejectedBy:d.rejectedBy||"",
    rejectedByUid:d.rejectedByUid||"",
    cancelledBy:d.cancelledBy||""
  };
}

function stampMillis(v){
  if(!v)return 0;
  if(typeof v.toMillis==="function")return v.toMillis();
  if(v.seconds)return Number(v.seconds)*1000;
  const n=Date.parse(v);
  return isNaN(n)?0:n;
}

function formatStamp(v){
  const n=stampMillis(v);
  return n?new Date(n).toLocaleString("en-IN"):"";
}

function startListeners(){
  unDrivers=onSnapshot(collection(db,"drivers"),snap=>{
    drivers=snap.docs.map(x=>({id:x.id,...x.data()}));
    setConnected(true);
    render();
  },err=>{
    console.error(err);
    setConnected(false);
    alert("Drivers read failed: "+err.message);
  });

  unDuties=onSnapshot(collection(db,"duties"),snap=>{
    duties=snap.docs.map(x=>({id:x.id,...x.data()}));
    setConnected(true);
    render();
  },err=>{
    console.error(err);
    setConnected(false);
    alert("Duties read failed: "+err.message);
  });

  onSnapshot(collection(db,"duty_history"),snap=>{
    history=snap.docs.map(x=>({id:x.id,...x.data()}));
    render();
  },err=>console.error("History:",err));
}

window.createDuty=createDuty;
window.approveDriver=approveDriver;
window.rejectDriver=rejectDriver;
window.blockDriver=blockDriver;
window.unblockDriver=unblockDriver;
window.deleteDriver=deleteDriver;
window.addWallet=addWallet;
window.deductWallet=deductWallet;
window.deleteDuty=deleteDuty;
window.cancelDuty=cancelDuty;
window.cancelAcceptedDuty=cancelAcceptedDuty;
window.completeDuty=completeDuty;

startListeners();
render();
</script>
