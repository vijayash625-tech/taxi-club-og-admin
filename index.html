window.showPage=function(p){page=p;["dashboard","duty","drivers","open","accepted","all","history"].forEach(x=>{const el=$("nav-"+x);if(el)el.classList.toggle("active",x===p);const mb=$("mb-"+x);if(mb)mb.classList.toggle("active",x===p);});render();window.scrollTo({top:0,behavior:"smooth"});};

function setConnected(ok){
  $("connection").textContent=ok?"FIREBASE CONNECTED":"FIREBASE ERROR";
  $("connection").style.background=ok?"#e9f8ef":"#ffe8ed";
  $("connection").style.color=ok?"#087443":"#b4233d";
}

function normalizeDate(v){
  let s=String(v||"").replace(/\D/g,"").slice(0,8);
  if(s.length===8)return s.slice(0,2)+"/"+s.slice(2,4)+"/"+s.slice(4,8);
  return v||"";
}

window.formatDate=function(input){
  input.value=normalizeDate(input.value);
};

function statusOf(d){return String(d.status||"OPEN").toUpperCase();}

function driverForDuty(d){
  const keys=[
    ["acceptedByUid",d.acceptedByUid],
    ["acceptedDriverId",d.acceptedDriverId],
    ["driverId",d.driverId],
    ["mobile",d.driverMobile]
  ];
  for(const [,value] of keys){
    if(!value)continue;
    const found=drivers.find(x=>
      String(x.uid||"")===String(value) ||
      String(x.driverId||x.id||"")===String(value) ||
      String(x.mobile||x.phone||"")===String(value)
    );
    if(found)return found;
  }
  return null;
}

function driverStatus(d){
  const s=String(d.status||"PENDING").toUpperCase();
  if(d.approved===true||s==="APPROVED"||s==="ACTIVE")return "APPROVED";
  return s;
}

function render(){
  if(page==="dashboard")renderDashboard();
  if(page==="duty")renderDuty();
  if(page==="drivers")renderDrivers();
  if(page==="open")renderOpen();
  if(page==="accepted")renderAccepted();
  if(page==="all")renderAllDuties();
  if(page==="history")renderHistory();
}

/* ===== DRIVER MOBILE SEARCH FUNCTIONS ===== */
function renderDriverApprovalList(statusFilter="ALL"){
  const q=String(driverMobileSearch||"").replace(/\D/g,"");

  const sourceDrivers=statusFilter!=="ALL" ? drivers.filter(d=>driverStatus(d)===statusFilter) : drivers;
  const list=q
    ? sourceDrivers.filter(d=>{
        const mobile=String(
          d.mobile||d.phone||d.driverMobile||""
        ).replace(/\D/g,"");

        return mobile.includes(q);
      })
    : sourceDrivers;

  const count=$("driverSearchCount");

  if(count){
    count.textContent=q
      ? `${list.length} driver${list.length===1?"":"s"} found`
      : "Showing all drivers";
  }

  return list.length
    ? list.map(driverCard).join("")
    : `<div class="empty">${
        q
          ? "No driver found for this mobile number."
          : "No drivers found."
      }</div>`;
}

window.filterDriversByMobile=function(value){
  driverMobileSearch=String(value||"");

  const box=$("driverApprovalList");

  if(box){
    box.innerHTML=renderDriverApprovalList();
  }

  const count=$("driverSearchCount");

  if(count){
    const q=driverMobileSearch.replace(/\D/g,"");

    if(!q){
      count.textContent="Showing all drivers";
    }
  }
};

window.clearDriverMobileSearch=function(){
  driverMobileSearch="";

  const input=$("driverMobileSearch");

  if(input){
    input.value="";
  }

  const box=$("driverApprovalList");

  if(box){
    box.innerHTML=renderDriverApprovalList();
  }

  const count=$("driverSearchCount");

  if(count){
    count.textContent="Showing all drivers";
  }
};

async function createDuty(){
  try{
    const pickup=$("pickup").value.trim();
    const drop=$("drop").value.trim();
    const date=normalizeDate($("date").value.trim());
    const time=$("time").value;
    const vehicle=$("vehicle").value;
    const dutyType=$("dutyType").value;
    const km=Number($("km").value);
    const amount=Number($("amount").value);
    const rentalHours=Number($("rentalHours").value||0);
    const specialService=$("specialService").value.trim();

    if(!pickup||!date||!time||!km||amount<0 || (dutyType!=="LOCAL RENTAL"&&!drop)){
      alert(dutyType==="LOCAL RENTAL" ? "Pickup, Date, Time, KM and Amount enter pannunga." : "Pickup, Drop, Date, Time, KM and Amount enter pannunga.");
      return;
    }
    if(dutyType==="LOCAL RENTAL" && rentalHours<1){
      alert("LOCAL RENTAL-ku hours enter pannunga.");
      return;
    }

    await addDoc(collection(db,"duties"),{
      dutyType, rentalHours:dutyType==="LOCAL RENTAL"?rentalHours:0,
      pickup,drop,date,time,vehicle,km,amount,specialService,
      note:specialService,status:"OPEN",
      acceptedBy:"",acceptedDriverId:"",acceptedByUid:"",
      driverId:"",driverName:"",driverMobile:"",
      rejectedBy:"",rejectedByUid:"",rejectedDriverId:"",
      cancelledBy:"",cancelledByUid:"",cancelledDriverId:"",
      cancellationDeduction:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()
    });
    alert("Duty created successfully.");
    showPage("open");
  }catch(e){

async function addWallet(id){
  const input=$("wallet-"+id);
  const amount=Number(input?.value);

  if(!amount||amount<=0){
    alert("Valid amount enter pannunga.");
    return;
  }

  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,"drivers",id);
      const snap=await tx.get(ref);

      if(!snap.exists())throw new Error("Driver not found");

      const old=Number(snap.data().walletBalance??snap.data().wallet??0);

      tx.update(ref,{
        walletBalance:old+amount,
        wallet:old+amount,
        lastWalletAction:"ADD",
        lastWalletAmount:amount,
        walletUpdatedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    });

    input.value="";
    alert("Wallet added.");
  }catch(e){
    console.error(e);
    alert("Wallet ADD failed: "+e.message);
  }
}

async function deductWallet(id){
  const input=$("wallet-"+id);
  const amount=Number(input?.value);

  if(!amount||amount<=0){
    alert("Valid amount enter pannunga.");
    return;
  }

  if(!confirm("Deduct ₹"+amount+" from wallet? Negative balance is allowed."))return;

  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,"drivers",id);
      const snap=await tx.get(ref);

      if(!snap.exists())throw new Error("Driver not found");

      const old=Number(snap.data().walletBalance??snap.data().wallet??0);
      const next=old-amount;

      tx.update(ref,{
        walletBalance:next,

        lastWalletAction:"DEDUCT",

        walletUpdatedAt:serverTimestamp(),

async function cancelAcceptedDuty(id){
  const d=duties.find(x=>x.id===id);
  if(!d)return;

  const dr=driverForDuty(d);
  const driverId=dr?.id||d.acceptedDriverId||d.driverId;
  const deduction=150;

  if(!confirm("Cancel accepted duty?\n₹150 will be deducted from the driver's wallet."))return;

  try{
    if(driverId){
      await runTransaction(db,async tx=>{
        const driverRef=doc(db,"drivers",driverId);
        const dutyRef=doc(db,"duties",id);

        const ds=await tx.get(driverRef);
        const ws=await tx.get(dutyRef);

        if(!ws.exists())throw new Error("Duty no longer exists");

        const old=ds.exists()?Number(ds.data().walletBalance??ds.data().wallet??0):0;
        const next=old-deduction;

        if(ds.exists()){
          tx.update(driverRef,{
            walletBalance:next,
            wallet:next,
            lastWalletAction:"DUTY_CANCEL_DEDUCTION",
            lastWalletAmount:deduction,
            walletUpdatedAt:serverTimestamp(),
            updatedAt:serverTimestamp()
          });
        }

        tx.delete(dutyRef);
      });
    }else{
      await deleteDoc(doc(db,"duties",id));
    }

    await addDoc(collection(db,"duty_history"),{
      ...historySafe(d),
      type:"DUTY_CANCELLED",
      status:"CANCELLED",
      cancelledBy:"ADMIN",
      cancellationDeduction:deduction,
      createdAt:serverTimestamp()
    });

    duties=duties.filter(x=>x.id!==id);
    render();

    alert("Accepted duty cancelled. ₹150 deducted.");
  }catch(e){
    console.error(e);
    alert("ACCEPTED DUTY CANCEL FAILED:\n"+e.message);
  }
}

async function completeDuty(id){
  const d=duties.find(x=>x.id===id);
  if(!d)return;

  if(!confirm("Mark this duty as COMPLETED?"))return;

  try{
    await runTransaction(db,async tx=>{
      const dutyRef=doc(db,"duties",id);
      const snap=await tx.get(dutyRef);

      if(!snap.exists())throw new Error("Duty no longer exists");

      const data=snap.data();
      const base=historySafe({...data,id});

      const tripRef=doc(collection(db,"trips"));
      const histRef=doc(collection(db,"duty_history"));

      tx.set(tripRef,{
        ...base,
        status:"COMPLETED",
        type:"TRIP_COMPLETED",
        completedAt:serverTimestamp(),
        createdAt:serverTimestamp()
      });

      tx.set(histRef,{
        ...base,
        status:"COMPLETED",
        type:"DUTY_COMPLETED",
        createdAt:serverTimestamp()
      });

      tx.delete(dutyRef);
    });

    duties=duties.filter(x=>x.id!==id);
    render();

    alert("Duty completed and removed from active duties.");
  }catch(e){
    console.error(e);
    alert("COMPLETE FAILED:\n"+e.message);
  }
}

function stampMillis(v){
  if(!v)return 0;
  if(typeof v.toMillis==="function")return v.toMillis();
  if(v.seconds)return Number(v.seconds)*1000;
  const n=Date.parse(v);
  return isNaN(n)?0:n;
}

function formatStamp(v){
  const n=stampMillis(v);
  return n?new Date(n).toLocaleString("en-IN"):"";
}

    // ADMIN-ONLY HISTORY CAPTURE:
    // Build 22 driver app already writes accepted/rejected fields on the duty.
    // Capture those events here with deterministic history IDs, without changing the driver app.
    snap.docs.forEach(async docSnap=>{

            adminCaptured:true
          },{merge:true});

        if(d.rejectedByUid || d.rejectedDriverId){
          const driverKey=String(d.rejectedByUid||d.rejectedDriverId).replace(/[^a-zA-Z0-9_-]/g,"_");

            rejectedBy:d.rejectedBy||"Driver",

            rejectedAt:d.rejectedAt||new Date().toISOString(),
            historyCreatedAt:d.rejectedAt||new Date().toISOString(),
            adminCaptured:true
          },{merge:true});
        }
      }catch(e){ console.error("Admin history capture failed:",e); }
    });

    setConnected(true);
    render();
  },err=>{
    console.error(err);
    setConnected(false);
    alert("Duties read failed: "+err.message);
  });

  onSnapshot(collection(db,"duty_history"),snap=>{
    history=snap.docs.map(x=>({id:x.id,...x.data()}));
    render();
  },err=>console.error("History:",err));
}

function ocrSet(id,v){
  if(v!==undefined&&v!==null&&String(v).trim())
    $(id).value=String(v).trim();
}

function cleanOCR(v){
  return String(v||'')
    .replace(/[|]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function parseOCRText(t){
  const raw=String(t||'').replace(/\r/g,'');
  const lines=raw.split('\n').map(x=>cleanOCR(x)).filter(Boolean);
  const low=raw.toLowerCase();

  const monthMap={jan:'01',january:'01',feb:'02',february:'02',mar:'03',march:'03',apr:'04',april:'04',may:'05',jun:'06',june:'06',jul:'07',july:'07',aug:'08',august:'08',sep:'09',sept:'09',september:'09',oct:'10',october:'10',nov:'11',november:'11',dec:'12',december:'12'};

  function normalizeOCRDate(v){
    v=cleanOCR(v);
    let m=v.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})\b/);
    if(m){
      let y=m[3].length===2?'20'+m[3]:m[3];
      return m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+'/'+y;
    }
    m=v.match(/\b(\d{1,2})\s+([A-Za-z]{3,9})[\s,\/-]+(\d{4})\b/i);
    if(m){
      const mo=monthMap[m[2].toLowerCase()];
      if(mo)return m[1].padStart(2,'0')+'/'+mo+'/'+m[3];
    }
    return '';
  }

  function findAfterLabel(labelRegexes){
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      for(const re of labelRegexes){
        const m=line.match(re);
        if(m && m[1]) return cleanOCR(m[1]);
        if(m && lines[i+1]) return cleanOCR(lines[i+1]);
      }
    }
    return '';
  }

  let date='';
  const dateLabel=raw.match(/(?:pickup\s*date|date)\s*[:=-]?\s*([^\n]+)/i);
  if(dateLabel) date=normalizeOCRDate(dateLabel[1]);
  if(!date){
    const m=raw.match(/\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/);
    if(m) date=normalizeOCRDate(m[0]);
  }
  if(!date){
    const m=raw.match(/\b\d{1,2}\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{4}\b/i);
    if(m) date=normalizeOCRDate(m[0]);
  }
  if(!date){
    const m=raw.match(/\b(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\b/i);
    if(m){const mo=monthMap[m[2].toLowerCase()];if(mo)date=m[1].padStart(2,'0')+'/'+mo+'/'+new Date().getFullYear();}
  }

  let time='';
  const timeLabel=raw.match(/(?:reporting\s*time|pickup\s*time|time)\s*[:=-]?\s*(\d{1,2}:\d{2}\s*(?:AM|PM)?)/i);
  if(timeLabel) time=cleanOCR(timeLabel[1]);
  if(time && !/am|pm/i.test(time)){
    const context=raw.match(new RegExp(time.replace(':','\\:')+'\\s*(AM|PM)','i'));
    if(context) time=cleanOCR(context[0]);
  }
  if(!time){
    const m=raw.match(/\b(\d{1,2}:\d{2}\s*(?:AM|PM))\b/i);
    if(m) time=cleanOCR(m[1]);
  }

  let km=(raw.match(/(?:KM\s*Limit|KM\s*limit|kilometers?|kilometres?)\s*[:=-]?\s*(\d+(?:\.\d+)?)/i)||[])[1]||'';
  if(!km){
    const m=raw.match(/(\d+(?:\.\d+)?)\s*KM\b/i);
    if(m)km=m[1];
  }

  let amount=(raw.match(/(?:confirm|amount|fare|price)\s*[@₹:]?\s*([\d,]+(?:\.\d+)?)/i)||[])[1]||'';
  if(!amount){
    const m=raw.match(/(?:₹|Rs\.?|INR|@)\s*([\d,]+(?:\.\d+)?)/i);
    if(m)amount=m[1];
  }
  amount=amount.replace(/,/g,'');

  let vehicle='';
  if(/innova\s*crysta|crysta/i.test(low)) vehicle='INNOVA CRYSTA';
  else if(/suv/i.test(low)) vehicle='SUV';
  else if(/sedan/i.test(low)) vehicle='SEDAN';
  else if(/wagon\s*r|swift|dzire|etios|honda\s*city|verna|aura|xcent/i.test(low)) vehicle='SEDAN';
  else if(/mini/i.test(low)) vehicle='MINI';

  let dutyType='ONE WAY';
  if(/local\s*rental|local\s*hire|local\s*\(/i.test(low)) dutyType='LOCAL RENTAL';
  else if(/round\s*trip|return\s*trip/i.test(low)) dutyType='ROUND TRIP';
  else if(/airport|air\s*port|pickup\s*drop/i.test(low)) dutyType='AIRPORT PICKUP / DROP';
  else if(/outstation/i.test(low)) dutyType='OUTSTATION';

  let hours=(raw.match(/(?:rental\s*hours?|hours?|hrs?)\s*[:=-]?\s*(\d{1,2})/i)||[])[1]||'';
  if(!hours){
    const m=raw.match(/(?:local[^\n]*?)\b(\d{1,2})\s*h\b/i);
    if(m)hours=m[1];
  }

  let pickup=findAfterLabel([/^(?:pickup\s*address|pick\s*address|pickup)\s*[:=-]?\s*(.*)$/i,/pickup\s*address\s*[:=-]?\s*(.*)/i]);
  let drop=findAfterLabel([/^(?:drop\s*address|drop\s*location|drop|dropoff|drop\s*off)\s*[:=-]?\s*(.*)$/i,/drop\s*address\s*[:=-]?\s*(.*)/i]);

  // If OCR splits the address across several lines, keep only the address block.
  function addressBlock(kind){
    const idx=lines.findIndex(l=>new RegExp(kind,'i').test(l));
    if(idx<0)return '';
    let first=lines[idx].replace(new RegExp('^.*?'+kind+'\\s*[:=-]?\\s*','i'),'').trim();
    const out=[]; if(first)out.push(first);
    const stop=/^(pickup\s*date|reporting\s*time|trip\s*type|car\s*type|km\s*limit|drop\s*address|drop\s*location|drop|special\s*services?|extras?|extra\s*km|extra\s*night|extra\s*hour|confirm|give\s*your\s*price|inclusions?|exclusions?)/i;
    for(let j=idx+1;j<lines.length;j++){
      if(stop.test(lines[j]))break;
      if(/^(address|pickup|pick\s*up)\s*$/i.test(lines[j]))continue;
      if(/^https?:\/\/(?:www\.)?google\.[^\s]+/i.test(lines[j]) || /^maps\.?app\.?goo\.gl/i.test(lines[j]))continue;
      out.push(lines[j]);
      if(out.length>=4)break;
    }
    return cleanOCR(out.join(' '));
  }
  if(!pickup) pickup=addressBlock('pickup(?:\\s+address)?');
  if(!drop) drop=addressBlock('drop(?:\\s+address|\\s+location)?');

  // Duty screenshots often put date/time directly after Pickup -.
  function stripPickupDateTime(v){
    let x=cleanOCR(v);
    x=x.replace(/^\d{1,2}\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s*,?\s*\d{1,2}:\d{2}\s*(?:AM|PM)?\s*/i,'');
    x=x.replace(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\s*,?\s*\d{1,2}:\d{2}\s*(?:AM|PM)?\s*/i,'');
    return cleanOCR(x);
  }
  pickup=stripPickupDateTime(pickup);
  // If Pickup was only "15 Sep, 10:30 am", recover the actual address block.
  if(!pickup) pickup=addressBlock('pickup(?:\s+address)?');
  // Never allow date/time fragments to become the pickup address.
  pickup=stripPickupDateTime(pickup);
  pickup=pickup.replace(/^[-–—:]+\s*/,'').trim();

  // Special Service is the only optional note we keep.
  let special=findAfterLabel([/^(?:special\s*service|special\s*services?)\s*[:=-]?\s*(.*)$/i,/special\s*service\s*[:=-]?\s*(.*)/i]);
  if(/^special\s*services?$/i.test(special)) special='';

  return {date,time,km,amount,vehicle,dutyType,hours,pickup:cleanOCR(pickup),drop:cleanOCR(drop),special:cleanOCR(special)};
}

window.runDutyOCR=async function(){
  const f=$('ocrFile').files?.[0];

  if(!f){
    alert('First screenshot select pannunga.');
    return;
  }

  const p=$('ocrProgress');
  p.textContent='Reading screenshot...';

  try{
    if(!window.Tesseract){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload=res;
        s.onerror=rej;
        document.head.appendChild(s);
      });
    }

    const r=await Tesseract.recognize(
      f,
      'eng',
      {
        logger:m=>{
          if(m.status)
            p.textContent=m.status+' '+(m.progress?Math.round(m.progress*100)+'%':'');
        }
      }
    );

    const text=r.data.text||'';
    const x=parseOCRText(text);

    ocrSet('ocrDate',x.date);
    ocrSet('ocrTime',x.time);
    ocrSet('ocrKm',x.km);
    ocrSet('ocrAmount',x.amount);
    ocrSet('ocrPickup',x.pickup);
    ocrSet('ocrDrop',x.drop);
    ocrSet('ocrHours',x.hours);
    ocrSet('ocrSpecial',x.special);

    if(x.vehicle)
      $('ocrVehicle').value=x.vehicle;

    if(x.dutyType)
      $('ocrDutyType').value=x.dutyType;


    p.textContent='OCR complete. Check/edit the fields, then CREATE DUTY.';

  }catch(e){
    console.error(e);
    p.textContent='OCR failed';
    alert('OCR failed: '+e.message);
  }
};

window.createDutyFromOCR=async function(){
  try{
    const pickup=$('ocrPickup').value.trim();
    const drop=$('ocrDrop').value.trim();
    const date=normalizeDate($('ocrDate').value.trim());
    const time=$('ocrTime').value.trim();
    const vehicle=$('ocrVehicle').value;
    const km=Number($('ocrKm').value);
    const amount=Number($('ocrAmount').value);
    const dutyType=$('ocrDutyType').value;
    const rentalHours=Number($('ocrHours').value||0);
    const specialService=$('ocrSpecial').value.trim();

    if(!pickup||!date||!time||!km||amount<=0 || (dutyType!=='LOCAL RENTAL'&&!drop)){
      alert(dutyType==='LOCAL RENTAL' ? 'Pickup, Date, Time, KM and Amount check pannunga.' : 'Pickup, Drop, Date, Time, KM and Amount check pannunga.');
      return;
    }

    if(dutyType==='LOCAL RENTAL'&&(rentalHours<1||rentalHours>12)){
      alert('LOCAL RENTAL hours 1-12 enter pannunga.');
      return;
    }



    await addDoc(collection(db,'duties'),{
      dutyType,
      rentalHours:dutyType==='LOCAL RENTAL'?rentalHours:0,
      pickup,
      drop,
      date,
      time,
      vehicle,
      km,
      amount,
      specialService,
      note:specialService,
      status:'OPEN',
      acceptedBy:'',
      acceptedDriverId:'',
      acceptedByUid:'',
      driverId:'',
      driverName:'',
      driverMobile:'',
      rejectedBy:'',
      rejectedByUid:'',
      rejectedDriverId:'',
      cancelledBy:'',
      cancelledByUid:'',
      cancelledDriverId:'',
      cancellationDeduction:0,
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });

    alert('Duty created successfully from OCR.');
    closeDutyOCR();
    showPage('open');

  }catch(e){
    console.error(e);
    alert('Duty create failed: '+e.message);
  }
};

<script>
/* ===== FINAL STRUCTURE: keep existing features, expose each job separately ===== */
(function(){

  window.showPage=function(p){
    page=p;
    const pages=['dashboard','duty','drivers','open','accepted','all','assignment','rejected','history'];

    render();

  function addNav(){
    const side=document.getElementById('sideMenu');
    if(side && !document.getElementById('side-new-duty')){
      const html=`
      <button id="side-new-duty" onclick="showPage('duty');toggleMenu()">🆕 <span>NEW DUTY</span></button>
      <button onclick="showPage('assignment');toggleMenu()">📋 <span>ASSIGNMENT / TRIP</span></button>
      <button onclick="showPage('accepted');toggleMenu()">✅ <span>ACCEPTED</span></button>
      <button onclick="showPage('rejected');toggleMenu()">❌ <span>REJECTED</span></button>`;
      side.insertAdjacentHTML('beforeend',html);
    }
    const nav=document.querySelector('.desktopNav');
    if(nav && !document.getElementById('nav-assignment')){
      nav.insertAdjacentHTML('beforeend',`<button id="nav-new-duty" onclick="showPage('duty')">🆕 NEW DUTY</button><button id="nav-assignment" onclick="showPage('assignment')">📋 ASSIGNMENT</button><button id="nav-rejected" onclick="showPage('rejected')">❌ REJECTED</button>`);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addNav); else addNav();

  window.renderDashboard=function(){
    const approved=drivers.filter(d=>driverStatus(d)==='APPROVED').length;
    const pending=drivers.filter(d=>driverStatus(d)==='PENDING').length;
    const blocked=drivers.filter(d=>driverStatus(d)==='BLOCKED').length;
    const open=duties.filter(d=>statusOf(d)==='OPEN').length;
    const accepted=duties.filter(d=>['ACCEPTED','STARTED'].includes(statusOf(d))).length;
    const rejected=history.filter(h=>String(h.type||h.status||'').toUpperCase().includes('REJECT')).length;
    $('app').innerHTML=`
      <div class="dashboardHero"><h2>🚕 TAXI CLUB OG</h2><p>ADMIN DASHBOARD • Drivers, new duties, assignments & trip history</p></div>
      <div class="card"><h2>👨‍✈️ DRIVER DASHBOARD</h2>
        <div class="driverDashCards">
          <button class="driverDashCard active" onclick="showPage('drivers');driverStatusFilter='APPROVED';renderDrivers()"><b>${approved}</b><span>ACTIVE / APPROVED DRIVERS • VIEW LIST</span></button>
          <button class="driverDashCard pending" onclick="showPage('drivers');driverStatusFilter='PENDING';renderDrivers()"><b>${pending}</b><span>PENDING DRIVERS • VIEW LIST</span></button>
        </div>
        <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="showPage('drivers')">🔎 SEARCH / MANAGE DRIVER</button><button class="btn red" onclick="showPage('drivers');driverStatusFilter='BLOCKED';renderDrivers()">🚫 BLOCKED (${blocked})</button></div>
      </div>
      <div class="card"><h2>🚕 DUTY PANEL</h2>
        <div class="adminSectionGrid">
          <button class="adminAction blue" onclick="showPage('duty')"><b>🆕 NEW DUTY</b><small>Create a fresh duty manually or use screenshot OCR.</small></button>
          <button class="adminAction purple" onclick="showPage('assignment')"><b>📋 ASSIGNMENT / TRIP</b><small>See every current duty and who has taken it.</small></button>
          <button class="adminAction green" onclick="showPage('accepted')"><b>✅ ACCEPTED</b><small>See accepted/started duties with driver details.</small></button>
          <button class="adminAction red" onclick="showPage('rejected')"><b>❌ REJECTED</b><small>See driver-rejected duty activity separately.</small></button>
          <button class="adminAction orange" onclick="showPage('open')"><b>🟢 OPEN DUTIES (${open})</b><small>Duties waiting for a driver.</small></button>
          <button class="adminAction pink" onclick="showPage('history')"><b>📚 FULL HISTORY (${history.length})</b><small>Accepted, rejected, cancelled, completed and deleted.</small></button>
        </div>
      </div>`;
  };

  window.renderDrivers=function(){
    const approved=drivers.filter(d=>driverStatus(d)==='APPROVED').length;
    const pending=drivers.filter(d=>driverStatus(d)==='PENDING').length;
    const blocked=drivers.filter(d=>driverStatus(d)==='BLOCKED').length;
    const rejected=drivers.filter(d=>driverStatus(d)==='REJECTED').length;
    const activeList=drivers.filter(d=>driverStatus(d)==='APPROVED');
    const pendingList=drivers.filter(d=>driverStatus(d)==='PENDING');
    const selected=driverStatusFilter==='ALL'?drivers:drivers.filter(d=>driverStatus(d)===driverStatusFilter);
    $('app').innerHTML=`
      <div class="pageIntro"><h1>👨‍✈️ Driver Dashboard</h1><div class="sub">Search a registered driver and Approve / Reject / Block</div></div>
      <div class="driverDashCards">
        <button class="driverDashCard active" onclick="driverStatusFilter='APPROVED';renderDrivers()"><b>${approved}</b><span>ACTIVE / APPROVED</span></button>
        <button class="driverDashCard pending" onclick="driverStatusFilter='PENDING';renderDrivers()"><b>${pending}</b><span>PENDING</span></button>
      </div>
      <div class="statgrid" style="margin-top:12px"><button class="stat clickable" onclick="driverStatusFilter='BLOCKED';renderDrivers()"><b>${blocked}</b><span>BLOCKED</span></button><button class="stat clickable" onclick="driverStatusFilter='REJECTED';renderDrivers()"><b>${rejected}</b><span>REJECTED</span></button></div>
      <div class="card"><h2>🔎 SEARCH DRIVER</h2>
        <div class="driver-search"><label>REGISTERED DRIVER MOBILE NUMBER</label><div class="search-row"><input id="driverMobileSearch" type="tel" inputmode="numeric" maxlength="15" placeholder="Enter driver mobile number" value="${esc(driverMobileSearch)}" oninput="filterDriversByMobile(this.value)"><button class="btn gray" onclick="clearDriverMobileSearch()">CLEAR</button></div><div id="driverSearchCount" class="search-count"></div></div>
        <div id="driverApprovalList">${selected.length?selected.map(driverCard).join(''):'<div class="empty">No drivers in this list.</div>'}</div>
      </div>`;
  };

  window.renderAssignment=function(){
    const list=[...duties].sort((a,b)=>stampMillis(b.createdAt)-stampMillis(a.createdAt));
    $('app').innerHTML=`<div class="pageIntro"><h1>📋 Assignment / Trip</h1><div class="sub">Every current duty — OPEN and driver-assigned</div></div>
      <div class="statgrid"><button class="stat clickable" onclick="showPage('open')"><b>${list.filter(d=>statusOf(d)==='OPEN').length}</b><span>OPEN</span></button><button class="stat clickable" onclick="showPage('accepted')"><b>${list.filter(d=>['ACCEPTED','STARTED'].includes(statusOf(d))).length}</b><span>ASSIGNED / ACCEPTED</span></button><button class="stat clickable" onclick="showPage('rejected')"><b>${history.filter(h=>String(h.type||h.status||'').toUpperCase().includes('REJECT')).length}</b><span>REJECTED</span></button><button class="stat clickable" onclick="showPage('history')"><b>${history.length}</b><span>FULL HISTORY</span></button></div>
      <div class="card"><h2>📋 CURRENT ASSIGNMENTS (${list.length})</h2>${list.length?list.map(allDutyCard).join(''):'<div class="empty">No current duties.</div>'}</div>`;
  };

  window.renderRejected=function(){
    const rows=[...history].filter(h=>String(h.type||h.status||'').toUpperCase().includes('REJECT')).sort((a,b)=>stampMillis(b.historyCreatedAt||b.rejectedAt||b.createdAt)-stampMillis(a.historyCreatedAt||a.rejectedAt||a.createdAt));
    $('app').innerHTML=`<div class="pageIntro"><h1>❌ Rejected Duties</h1><div class="sub">Drivers who rejected duties</div></div><div class="card"><h2>❌ REJECTED (${rows.length})</h2>${rows.length?rows.map(historyCard).join(''):'<div class="empty">No rejected duty history found.</div>'}</div>`;
  };

  const oldRender=window.render;
  window.render=function(){
    if(page==='dashboard')return renderDashboard();
    if(page==='drivers')return renderDrivers();
    if(page==='assignment')return renderAssignment();
    if(page==='rejected')return renderRejected();
    return oldRender();
  };
})();
</script>
